plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id "me.modmuss50.mod-publish-plugin" version "0.6.3"

}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.add(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()
        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

publishMods {
    file = file("../neoforge/build/libs/halloween_mood-neoforge-${minecraft_version}-${version}.jar")
    changelog = file("../changelog.md").getText('UTF-8')
    type = STABLE
    modLoaders.add("neoforge")
    displayName = "[Neoforge] Halloween Mood ${version}"

    curseforge {
        projectId = "687184"
        projectSlug = "halloween-mood" // Required for discord webhook
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        minecraftVersions.add("${minecraft_version}")
        javaVersions.add(JavaVersion.VERSION_21)
    }

    modrinth {
        projectId = "b2s0tKbF"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add("${minecraft_version}")
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }